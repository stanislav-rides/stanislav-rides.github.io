	<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    line-height:1.6;
    background:#f5f5f5;
    color:#333;
}

header{
    background:#1f2937;
    color:white;
    text-align:center;
    padding:60px 20px;
}

header h1{
    font-size:3rem;
}

header p{
    margin-top:10px;
    font-size:1.2rem;
}

nav{
    background:#111827;
    padding:15px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 15px;
    font-weight:bold;
}

section{
    max-width:1200px;
    margin:auto;
    padding:50px 20px;
}

h2{
    margin-bottom:20px;
    color:#1f2937;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.gallery img{
    width:100%;
    height:250px;
    object-fit:cover;
    border-radius:10px;
}

.reference{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:10px;
}

form{
    background:white;
    padding:20px;
    border-radius:10px;
}

input,
textarea{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

footer{
    background:#111827;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:40px;
}

iframe{
    width:100%;
    height:400px;
    border:none;
    border-radius:10px;
}

@media(max-width:600px){
    header h1{
        font-size:2rem;
    }
}
</style>
</head>
