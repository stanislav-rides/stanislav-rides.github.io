<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:0;

header{
    background:#1f2937;
    color:white;
    text-align:center;
    padding:40px;
}

nav{
    background:#111827;
    padding:15px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 15px;
    font-weight:bold;
}

.gallery{
    max-width:1200px;
    margin:auto;
    padding:30px;
    column-count:3;
    column-gap:20px;
}

.gallery img{
    width:100%;
    margin-bottom:20px;
    display:block;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,0.2);
    cursor:pointer;
    transition:0.3s;
}

.gallery img:hover{
    transform:scale(1.02);
}

.lightbox{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.95);
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.lightbox.active{
    display:flex;
}

.lightbox img{
    max-width:90%;
    max-height:90%;
}

@media(max-width:900px){
    .gallery{
        column-count:2;
    }
}

@media(max-width:600px){
    .gallery{
        column-count:1;
    }
}
</style>

<script>
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");

document.querySelectorAll(".gallery img").forEach(img => {
    img.addEventListener("click", () => {
        lightbox.classList.add("active");
        lightboxImg.src = img.src;
    });
});

lightbox.addEventListener("click", () => {
    lightbox.classList.remove("active");
});
</script>
